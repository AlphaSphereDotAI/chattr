[tools]
entire = "latest"
tombi = "latest"
"npm:openwiki" = "latest"
prek = "latest"
"pipx:commitizen" = "latest"
github-cli = "latest"
uv = "latest"
"github:lukehsiao/pyproject-udeps" = "latest"
doppler = "latest"

[settings]
minimum_release_age = "0d"

[[watch_files]]
patterns = ["src/**/*.py"]
run = "uv format"

[env]
DOPPLER_ENV = 1

[tasks.start]
run = "uv run chattr"